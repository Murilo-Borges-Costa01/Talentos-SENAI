<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Banco de Talentos SENAI</title>
  <link rel="stylesheet" href="../Front-end/css/style.css">
  <link rel="stylesheet" href="../Front-end/css/login.css">
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <div class="login-logo">
        <img src="../FINDES SENAI BRANCO@300x (1).png" alt="SENAI">
      </div>

      <h1 class="login-title">Banco de Talentos</h1>
      <p class="login-subtitle">Portal SENAI</p>

      <form id="formLogin" class="auth-panel active" data-auth-panel="login">
        <!-- E-mail -->
        <div class="form-group">
          <label for="email">E-mail:</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="Digite seu e-mail"
            required
          >
        </div>

        <!-- Senha -->
        <div class="form-group">
          <label for="senha">Senha:</label>
          <input 
            type="password" 
            id="senha" 
            name="senha" 
            placeholder="Digite sua senha"
            required
          >
        </div>

        <!-- Botões -->
        <div class="form-buttons">
          <button type="submit" class="btn btn-primary">Entrar</button>
          <button type="reset" class="btn btn-secondary">Cancelar</button>
        </div>
        <p id="loginMessage" class="form-message" hidden></p>
      </form>

      <form id="formRegister" class="auth-panel" data-auth-panel="register" hidden>
        <div class="form-group">
          <label for="registerNome">Nome completo:</label>
          <input
            type="text"
            id="registerNome"
            name="registerNome"
            placeholder="Digite seu nome"
            required
          >
        </div>

        <div class="form-group">
          <label for="registerEmail">E-mail:</label>
          <input
            type="email"
            id="registerEmail"
            name="registerEmail"
            placeholder="Digite seu e-mail"
            required
          >
        </div>

        <div class="form-group">
          <label for="registerSenha">Senha:</label>
          <input
            type="password"
            id="registerSenha"
            name="registerSenha"
            placeholder="Mínimo de 6 caracteres"
            minlength="6"
            required
          >
        </div>

        <div class="form-buttons">
          <button type="submit" class="btn btn-primary">Criar conta</button>
          <button type="reset" class="btn btn-secondary">Limpar</button>
        </div>
        <button type="button" class="auth-back" data-auth-tab="login">Voltar para login</button>
        <p id="registerMessage" class="form-message" hidden></p>
      </form>

      <form id="formForgotPassword" class="auth-panel" data-auth-panel="forgot" hidden>
        <div class="form-group">
          <label for="forgotEmail">E-mail da conta:</label>
          <input
            type="email"
            id="forgotEmail"
            name="forgotEmail"
            placeholder="Digite o e-mail cadastrado"
            required
          >
        </div>

        <div class="form-group">
          <label for="forgotNovaSenha">Nova senha:</label>
          <input
            type="password"
            id="forgotNovaSenha"
            name="forgotNovaSenha"
            placeholder="Mínimo de 6 caracteres"
            minlength="6"
            required
          >
        </div>

        <div class="form-buttons">
          <button type="submit" class="btn btn-primary">Redefinir senha</button>
          <button type="reset" class="btn btn-secondary">Limpar</button>
        </div>
        <button type="button" class="auth-back" data-auth-tab="login">Voltar para login</button>
        <p id="forgotMessage" class="form-message" hidden></p>
      </form>

      <div class="auth-actions" role="tablist" aria-label="Ações de autenticação">
        <a class="auth-action-btn" href="./html/aluno/cadastrar-aluno.html">Criar conta</a>
        <button type="button" class="auth-action-btn" data-auth-tab="forgot">Esqueci senha</button>
      </div>
    </div>
  </div>

  <script src="../Front-end/js/app.js"></script>
</body>
</html>
