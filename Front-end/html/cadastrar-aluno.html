<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Aluno - Banco de Talentos SENAI</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/cadastrar-aluno.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-brand">
      <img src="../FINDES SENAI BRANCO@300x (1).png" alt="SENAI">
      <span>Banco de Talentos</span>
    </div>
    <ul>
      <li><a href="dashboard.html">Início</a></li>
      <li><a href="visualizar-vagas.html">Vagas</a></li>
      <li><a href="relatorios.html">Relatórios</a></li>
      <li><a href="login.html" data-logout>Sair</a></li>
    </ul>
    <div class="user-menu">
      <span>👤 Pedagogo</span>
    </div>
  </nav>

  <!-- Header -->
  <div class="page-header">
    <h1>Banco de Talentos SENAI</h1>
    <p>Cadastrar Aluno</p>
  </div>

  <!-- Container Principal -->
  <div class="container">
    <div class="form-card">
      <h2 style="color: #003d99; margin-bottom: 2rem;">Cadastrar Aluno</h2>
      
      <form id="formCadastroAluno">
        <!-- Nome Completo -->
        <div class="form-group">
          <label for="nomeCompleto">
            Nome Completo: <span class="required">*</span>
          </label>
          <input 
            type="text" 
            id="nomeCompleto" 
            name="nomeCompleto" 
            placeholder="Digite o nome completo"
            required
          >
        </div>

        <!-- E-mail -->
        <div class="form-group">
          <label for="email">
            E-mail: <span class="required">*</span>
          </label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="Digite o e-mail"
            required
          >
        </div>

        <!-- Contato -->
        <div class="form-group">
          <label for="contato">
            Contato (Telefone/WhatsApp): <span class="required">*</span>
          </label>
          <input 
            type="tel" 
            id="contato" 
            name="contato" 
            placeholder="(XX) XXXXX-XXXX"
            required
          >
        </div>

        <!-- Curso e Ano -->
        <div class="form-row">
          <div class="form-group">
            <label for="curso">
              Curso Realizado: <span class="required">*</span>
            </label>
            <select id="curso" name="curso" required>
              <option value="">Selecione o curso...</option>
              <option value="desenvolvimento-sistemas">Desenvolvimento de Sistemas</option>
              <option value="eletrotecnica">Eletrotécnica</option>
              <option value="mecanica">Mecânica</option>
              <option value="administracao">Administração</option>
              <option value="recursos-humanos">Recursos Humanos</option>
              <option value="logistica">Logística</option>
            </select>
          </div>

          <div class="form-group">
            <label for="anoConclusao">
              Ano de Conclusão: <span class="required">*</span>
            </label>
            <input 
              type="number" 
              id="anoConclusao" 
              name="anoConclusao" 
              placeholder="YYYY"
              min="1900"
              max="3000"
              required
            >
          </div>
        </div>

        <!-- Turma -->
        <div class="form-group">
          <label for="turma">
            Turma: <span class="required">*</span>
          </label>
          <input 
            type="text" 
            id="turma" 
            name="turma" 
            placeholder="Digite a turma"
            required
          >
        </div>

        <!-- Descrição -->
        <div class="form-group char-count">
          <label for="descricao">
            Descrição (resumo profissional):
          </label>
          <textarea 
            id="descricao" 
            name="descricao" 
            placeholder="Descreva sua experiência profissional..."
            maxlength="500"
          ></textarea>
          <div class="char-count-display">
            <span id="charCount">0</span>/500
          </div>
        </div>

        <!-- Botões -->
        <div class="form-buttons">
          <button type="submit" class="btn btn-primary">Cadastrar Aluno</button>
          <button type="reset" class="btn btn-secondary">Cancelar</button>
        </div>
      </form>
      <p id="alunoMessage" class="form-message" hidden></p>
    </div>
  </div>

  <script src="../js/app.js"></script>
</body>
</html>
