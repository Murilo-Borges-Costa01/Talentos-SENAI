<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Nova Vaga - Banco de Talentos SENAI</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/criar-vaga.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-brand">
      <img src="../../assets/FINDES SENAI BRANCO@300x (1).png" alt="SENAI">
      <span>Banco de Talentos</span>
    </div>
    <ul>
      <li><a href="dashboard.html">Início</a></li>
      <li><a href="visualizar-vagas.html">Vagas</a></li>
      <li><a href="relatorios.html">Relatórios</a></li>
      <li><a href="login.html" data-logout>Sair</a></li>
    </ul>
    <div class="user-menu">
      <span>👤 Pedagogo</span>
    </div>
  </nav>

  <!-- Header -->
  <div class="page-header">
    <h1>Banco de Talentos SENAI</h1>
    <p>Criar Nova Vaga</p>
  </div>

  <!-- Container Principal -->
  <div class="container">
    <div class="form-card">
      <h2 style="color: #003d99; margin-bottom: 2rem;">Criar Nova Vaga</h2>
      
      <form id="formCriarVaga">
        <!-- Título da Vaga -->
        <div class="form-group">
          <label for="tituloVaga">
            Título da Vaga: <span class="required">*</span>
          </label>
          <input 
            type="text" 
            id="tituloVaga" 
            name="tituloVaga" 
            placeholder="Digite o título da vaga"
            required
          >
        </div>

        <!-- Descrição -->
        <div class="form-group char-count">
          <label for="descricaoVaga">
            Descrição: <span class="required">*</span>
          </label>
          <textarea 
            id="descricaoVaga" 
            name="descricaoVaga" 
            placeholder="Descreva detalhes da vaga..."
            maxlength="1000"
            required
          ></textarea>
          <div class="char-count-display">
            <span id="charCountDescricao">0</span>/1000
          </div>
        </div>

        <!-- Empresa -->
        <div class="form-group">
          <label for="empresa">
            Empresa: <span class="required">*</span>
          </label>
          <input 
            type="text" 
            id="empresa" 
            name="empresa" 
            placeholder="Digite o nome da empresa"
            required
          >
        </div>

        <!-- Data de Expiração -->
        <div class="form-group">
          <label for="dataExpiracao">
            Data de Expiração:
          </label>
          <input 
            type="date" 
            id="dataExpiracao" 
            name="dataExpiracao"
            required
          >
        </div>

        <!-- Requisitos -->
        <div class="form-group char-count">
          <label for="requisitos">
            Requisitos (filtros do candidato): <span class="required">*</span>
          </label>
          <textarea 
            id="requisitos" 
            name="requisitos" 
            placeholder="Descreva os requisitos e habilidades necessárias..."
            maxlength="1000"
            required
          ></textarea>
          <div class="char-count-display">
            <span id="charCountRequisitos">0</span>/1000
          </div>
        </div>

        <!-- Botões -->
        <div class="form-buttons">
          <button type="submit" class="btn btn-primary">Criar Vaga</button>
          <button type="reset" class="btn btn-secondary">Cancelar</button>
        </div>
      </form>
      <p id="vagaMessage" class="form-message" hidden></p>
    </div>
  </div>

  <script src="../../js/app.js"></script>
</body>
</html>
