<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizar Vagas - Banco de Talentos SENAI</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/visualizar-vagas.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-brand">
      <img src="../FINDES SENAI BRANCO@300x (1).png" alt="SENAI">
      <span>Banco de Talentos</span>
    </div>
    <ul>
      <li><a href="dashboard.html">Início</a></li>
      <li><a href="visualizar-vagas.html">Vagas</a></li>
      <li><a href="relatorios.html">Relatórios</a></li>
      <li><a href="login.html" data-logout>Sair</a></li>
    </ul>
    <div class="user-menu">
      <span>👤 Pedagogo</span>
    </div>
  </nav>

  <!-- Header -->
  <div class="page-header">
    <h1>Banco de Talentos SENAI</h1>
    <p>Visualizar Vagas</p>
  </div>

  <!-- Container Principal -->
  <div class="container">
    <!-- Filtros e Busca -->
    <div class="search-section">
      <div class="search-bar">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Buscar por título, empresa, ou requisitos..."
          class="search-input"
        >
        <button class="btn btn-primary search-btn">Buscar</button>
      </div>

      <div class="filters-row">
        <select id="filterEmpresa" class="filter-select">
          <option value="">Empresa</option>
          <option value="empresa-xyz">Empresa XYZ</option>
          <option value="tech-solutions">Tech Solutions Ltd.</option>
          <option value="metalurgica-silva">Metalúrgica Silva</option>
          <option value="outra">Outra</option>
        </select>

        <select id="filterCurso" class="filter-select">
          <option value="">Curso</option>
          <option value="desenvolvimento-sistemas">Desenvolvimento de Sistemas</option>
          <option value="tecnico-mecanica">Técnico em Mecânica</option>
          <option value="tecnico-eletrotecnica">Técnico em Eletrotécnica</option>
          <option value="administracao">Administração</option>
        </select>

        <select id="filterStatus" class="filter-select">
          <option value="">Selecionar status...</option>
          <option value="ativa">Ativa</option>
          <option value="expirada">Expirada</option>
          <option value="encerrada">Encerrada</option>
        </select>

        <button class="btn btn-secondary filter-btn">Filtrar</button>
      </div>
    </div>

    <!-- Lista de Vagas -->
    <div class="vagas-section">
      <h2>Lista de Vagas Disponíveis</h2>

      <div class="vagas-list" id="vagasList"></div>

      <!-- Paginação -->
      <div class="pagination">
        <span class="pagination-info">Mostrando 1 - 3 de 3 vagas</span>
        <div class="pagination-links">
          <span class="page-link active">1</span>
          <span class="page-link">2</span>
          <span class="page-link">3</span>
          <span class="page-link">7</span>
          <span class="page-link">Próximo</span>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/app.js"></script>
</body>
</html>
